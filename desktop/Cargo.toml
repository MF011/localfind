[package]
name = "localfind"
version = "0.1.0"
edition = "2021"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
localfind-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite_bridge = { package = "rusqlite", version = "0.32" }
open = "5"
