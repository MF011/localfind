[package]
name = "localfind-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8"
blake3 = "1"
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Security"] }
[dev-dependencies]
tempfile = "3"
